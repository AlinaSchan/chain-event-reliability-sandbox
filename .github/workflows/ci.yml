name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      # Same values as .env.example / docker-compose.yml: throwaway local services, no secrets.
      DATABASE_URL: postgres://sandbox:sandbox@127.0.0.1:5432/cers
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (no services)
        run: npm run test:unit

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait

      - name: Apply migrations to the public schema
        run: npm run db:migrate

      - name: Integration and fault-injection tests (real PostgreSQL and Redis)
        run: npx vitest run --project integration --reporter=default --reporter=json --outputFile=test-results/integration.json

      - name: Test summary (fails on any skipped test)
        if: always()
        shell: bash
        run: |
          if [ -f test-results/integration.json ]; then
            node scripts/test-summary.mjs test-results/integration.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no integration report was produced" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Failure scenarios S01-S09 (fails on any failed or skipped scenario)
        run: npm run scenarios

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down -v
